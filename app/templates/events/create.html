{% extends "base.html" %}

{% block title %}
Create Event
{% endblock %}

{% block content %}

<div class="max-w-3xl mx-auto">

    <div class="bg-white rounded-xl shadow p-6">

        <h1 class="text-2xl font-bold text-gray-800 mb-6">
            Create Event
        </h1>

        <form
            method="POST"
            action="{{ url_for('main.create_event') }}"
            class="space-y-5"
        >

            <!-- Event Name -->
            <div>

                <label
                    for="event_name"
                    class="block text-sm font-medium text-gray-700 mb-1"
                >
                    Event Name
                </label>

                <input
                    type="text"
                    id="event_name"
                    name="event_name"
                    value="{{ request.form.get('event_name', '') }}"
                    required
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Enter event name"
                >

            </div>


            <!-- Organizer -->
            <div>

                <label
                    for="organizer"
                    class="block text-sm font-medium text-gray-700 mb-1"
                >
                    Organizer
                </label>

                <input
                    type="text"
                    id="organizer"
                    name="organizer"
                    value="{{ request.form.get('organizer', '') }}"
                    required
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Enter organizer name"
                >

            </div>


            <!-- Expected Attendance -->
            <div>

                <label
                    for="expected_attendance"
                    class="block text-sm font-medium text-gray-700 mb-1"
                >
                    Expected Attendance
                </label>

                <input
                    type="number"
                    id="expected_attendance"
                    name="expected_attendance"
                    value="{{ request.form.get('expected_attendance', '') }}"
                    min="1"
                    required
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Enter expected attendance"
                >

            </div>


            <!-- Start Date & Time -->
            <div>

                <label
                    for="start_datetime"
                    class="block text-sm font-medium text-gray-700 mb-1"
                >
                    Start Date & Time
                </label>

                <input
                    type="datetime-local"
                    id="start_datetime"
                    name="start_datetime"
                    value="{{ request.form.get('start_datetime', '') }}"
                    required
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                >

            </div>


            <!-- End Date & Time -->
            <div>

                <label
                    for="end_datetime"
                    class="block text-sm font-medium text-gray-700 mb-1"
                >
                    End Date & Time
                </label>

                <input
                    type="datetime-local"
                    id="end_datetime"
                    name="end_datetime"
                    value="{{ request.form.get('end_datetime', '') }}"
                    required
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                >

            </div>


            <!-- Status -->
            <div>

                <label
                    class="block text-sm font-medium text-gray-700 mb-1"
                >
                    Event Status
                </label>

                <input
                    type="text"
                    value="Pending"
                    disabled
                    class="w-full bg-gray-100 border border-gray-300 rounded-lg px-4 py-2 text-gray-600"
                >

                <!-- Hidden value sent to Flask -->
                <input
                    type="hidden"
                    name="status"
                    value="Pending"
                >

                <p class="text-sm text-gray-500 mt-1">
                    New events are created as Pending. The status will be updated automatically.
                </p>

            </div>


            <!-- Buttons -->
            <div class="flex items-center gap-3 pt-4">

                <button
                    type="submit"
                    class="bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700 transition"
                >
                    Create Event
                </button>

                <a
                    href="{{ url_for('main.events') }}"
                    class="bg-gray-200 text-gray-700 px-5 py-2 rounded-lg hover:bg-gray-300 transition"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
